<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>E_PUNCH – Cartes</title>
  <link rel="stylesheet" href="/assets/css/site.css" />

  <style>
    .page-title { margin: 18px 0 6px; }
    .page-subtitle { margin: 0 0 18px; opacity: .8; }

    .cards { display: grid; gap: 14px; }

    .card {
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,.6);
    }

    .row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .thumb {
      width: 220px;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.12);
      display: block;
    }

    .body { flex: 1 1 260px; }
    .body h3 { margin: 0 0 6px; }

    .meta { opacity: .85; margin: 0 0 10px; }
    .note { font-size: .95em; opacity: .75; margin: 0; }

    .error {
      padding: 10px 12px;
      border: 1px solid rgba(255,0,0,.25);
      border-radius: 12px;
    }

    /* ✅ Ajouts */
    .badges { display:flex; gap:8px; flex-wrap:wrap; margin: 0 0 10px; }
    .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.7);
      font-size: .9em;
      opacity: .9;
      line-height: 1;
    }
    .badge.locked {
      border-color: rgba(255,140,0,.25);
      background: rgba(255,165,0,.12);
    }
    .badge.permanent {
      border-color: rgba(0,128,0,.18);
      background: rgba(0,128,0,.10);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">E_PUNCH</a>

      <nav class="nav">
        <a href="/app/">L’app</a>
        <a href="/cartes/">Cartes</a>
        <a href="/support/">Support</a>
        <a href="/legal/">Mentions légales</a>
      </nav>
    </div>
  </header>

  <!-- CONTENU -->
  <main class="wrap">
    <h1 class="page-title">Cartes</h1>
    <p class="page-subtitle">
      En construction . Aperçu des cartes disponibles. Les cartes complètes sont destinées à l’application E_PUNCH.
    </p>

    <div id="cartes-list" class="cards">
      <p>Chargement…</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="wrap">© E_PUNCH</div>
  </footer>

  <script>
    function parseRevealAt(revealAt) {
      if (!revealAt || typeof revealAt !== "string") return null;
      const d = new Date(revealAt);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatHHMM(date) {
      return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(date);
    }
function formatDDMM_HHMM(date) {
  // Exemple : 02/01 à 14:00
  const d = new Intl.DateTimeFormat("fr-FR", {
    day: "2-digit",
    month: "2-digit"
  }).format(date);

  const t = new Intl.DateTimeFormat("fr-FR", {
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);

  return `${d} à ${t}`;
}

    function usageOf(c) {
      return String(c?.usage || "").toLowerCase();
    }

    function isCompetitionLocked(c) {
      if (usageOf(c) !== "competition") return false;
      const rd = parseRevealAt(c.revealAt);
      if (!rd) return false;
      return new Date() < rd;
    }

    function openMapUrlFromId(id) {
      // ✅ robuste (espaces, accents…) -> encodé correctement
      return "/open-map/?id=" + encodeURIComponent(id);
    }

    async function loadCartes() {
      const container = document.getElementById("cartes-list");
      if (!container) return;

      try {
        const res = await fetch("/cartes/index.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const cartes = await res.json();
        if (!Array.isArray(cartes) || cartes.length === 0) {
          container.innerHTML = "<p>Aucune carte pour le moment.</p>";
          return;
        }

        container.innerHTML = cartes.map(c => {
          const titre = c.titre ?? "Carte";
          const meta = [
            c.region ? `<strong>${c.region}</strong>` : "",
            c.commune ?? "",
            c.date ?? "",
            c.echelle ? `Échelle ${c.echelle}` : ""
          ].filter(Boolean).join(" — ");

          const usage = usageOf(c);
          const locked = isCompetitionLocked(c);
          const revealDate = parseRevealAt(c.revealAt);

          // ✅ on autorise toujours le clic (même competition verrouillée)
          // et on ne dépend plus de c.openUrl
          const href = openMapUrlFromId(c.id);

          const badges = [];
          if (usage === "permanent") {
            badges.push(`<span class="badge permanent">✅ Permanent</span>`);
          } else if (usage === "competition") {
            if (locked && revealDate) {
             badges.push(`<span class="badge locked">🏁 Compétition — visible le ${formatDDMM_HHMM(revealDate)}</span>`);
            } else {
              badges.push(`<span class="badge">🏁 Compétition</span>`);
            }
          } else if (usage) {
            badges.push(`<span class="badge">${usage}</span>`);
          }

          return `
            <article class="card">
              <div class="row">
                <a href="${href}" aria-label="Ouvrir ${titre}">
                  <img class="thumb" src="${c.thumb}" alt="Vignette ${titre}" loading="lazy">
                </a>

                <div class="body">
                  <h3>${titre}</h3>
                  <div class="meta">${meta}</div>

                  ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}

                  <p class="note">
                    Cette carte est destinée à l’application E_PUNCH.
                  </p>
                </div>
              </div>
            </article>
          `;
        }).join("");

      } catch (e) {
        container.innerHTML = `
          <div class="error">
            <strong>Erreur :</strong> ${String(e)}<br>
            Test : <a href="/cartes/index.json">/cartes/index.json</a>
          </div>
        `;
      }
    }

    loadCartes();
  </script>
</body>
</html>
