<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E_PUNCH — Ouvrir une carte</title>
  <link rel="stylesheet" href="/assets/css/site.css" />
  <style>
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px; }
    .card { border: 1px solid rgba(0,0,0,.12); border-radius: 14px; padding: 14px; background: rgba(255,255,255,.6); }
    .thumb { width: 100%; height: auto; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); display:block; }
    .muted { opacity:.75; }
    .sp { height: 10px; }

    #content {
      display: block;
      min-height: 20px;
      color: #000;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="content">
      <p class="muted">Chargement…</p>
      <noscript>
        <p><strong>JavaScript est désactivé</strong> : la page ne peut pas afficher la carte.</p>
      </noscript>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const content = document.getElementById("content");

    function parseRevealAt(revealAt) {
      if (!revealAt || typeof revealAt !== "string") return null;
      const d = new Date(revealAt);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatHHMM(date) {
      return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(date);
    }

    function formatDDMM_HHMM(date) {
      // Exemple : 02/01 à 14:00
      const d = new Intl.DateTimeFormat("fr-FR", {
        day: "2-digit",
        month: "2-digit"
      }).format(date);

      const t = new Intl.DateTimeFormat("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);

      return `${d} à ${t}`;
    }

    function isCompetitionLocked(card) {
      const usage = (card?.usage || "").toLowerCase();
      if (usage !== "competition") return false;
      const revealDate = parseRevealAt(card.revealAt);
      if (!revealDate) return false;
      return new Date() < revealDate;
    }

    async function load() {
      if (!content) return;

      if (!id) {
        content.innerHTML = `
          <p><strong>Erreur :</strong> paramètre <code>id</code> manquant.</p>
          <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
        `;
        return;
      }

      const res = await fetch("/cartes/index.json", { cache: "no-store" });
      if (!res.ok) throw new Error("index.json introuvable (HTTP " + res.status + ")");

      const cartes = await res.json();
      const c = Array.isArray(cartes) ? cartes.find(x => x.id === id) : null;

      if (!c) {
        content.innerHTML = `
          <p><strong>Carte introuvable :</strong> <code>${id}</code></p>
          <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
        `;
        return;
      }

      const thumbUrl = c.thumb;
      const titre = c.titre ?? c.id;

      const meta = [
        c.region ? `<strong>${c.region}</strong>` : "",
        c.commune ?? "",
        c.date ?? "",
        c.echelle ? `Échelle ${c.echelle}` : ""
      ].filter(Boolean).join(" — ");

      const locked = isCompetitionLocked(c);
      const revealDate = parseRevealAt(c.revealAt);

      const lockLine = locked && revealDate
        ? `<p class="muted"><strong>Carte visible à partir du ${formatDDMM_HHMM(revealDate)}</strong></p>`
        : ((c.usage || "").toLowerCase() === "competition"
            ? `<p class="muted"><strong>Carte visible</strong></p>`
            : ``);

      // ✅ Message uniquement quand la carte est verrouillée (compétition)
      const competitionNote = locked
        ? `<p class="muted"><em>Par équité, carte masquée jusqu’à l’heure d’ouverture. Chargez-la avant la course pour enregistrer votre trace.</em></p>`
        : ``;

      content.innerHTML = `
        ${thumbUrl ? `
          <img class="thumb" src="${thumbUrl}" alt="Aperçu ${c.id}">
        ` : `<p class="muted">Pas de vignette définie.</p>`}

        <div class="sp"></div>
        <p><strong>${titre}</strong></p>
        <p class="muted">${meta}</p>
        ${lockLine}
        ${competitionNote}
        <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
      `;
    }

    load().catch(err => {
      content.innerHTML = `
        <p><strong>Erreur :</strong> ${err.message}</p>
        <p class="muted">Test : <a href="/cartes/index.json">/cartes/index.json</a></p>
        <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
      `;
      console.error(err);
    });
  </script>
</body>
</html>
