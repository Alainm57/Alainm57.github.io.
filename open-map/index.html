<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const content = document.getElementById("content");

  async function load() {
    if (!id) {
      content.innerHTML = `
        <p><strong>Erreur :</strong> aucune carte indiquée (paramètre <code>id</code> manquant).</p>
        <p class="muted">Retourne sur la page <a href="/cartes/">Cartes</a> et clique à nouveau sur une vignette.</p>
      `;
      return;
    }

    // Charger l’index JSON des cartes
    const res = await fetch("/cartes/index.json", { cache: "no-store" });
    if (!res.ok) throw new Error("index.json introuvable (HTTP " + res.status + ")");

    const cartes = await res.json();
    const c = Array.isArray(cartes) ? cartes.find(x => x.id === id) : null;

    if (!c) {
      content.innerHTML = `
        <p><strong>Carte introuvable :</strong> <code>${id}</code></p>
        <p class="muted">Vérifie que l’entrée existe dans <code>/cartes/index.json</code>.</p>
        <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
      `;
      return;
    }

    const thumbUrl = c.thumb;
    const titre = c.titre ?? c.id;
    const meta = [
      c.region ? `<strong>${c.region}</strong>` : "",
      c.commune ?? "",
      c.date ?? "",
      c.echelle ? `Échelle ${c.echelle}` : ""
    ].filter(Boolean).join(" — ");

    content.innerHTML = `
      ${thumbUrl ? `
        <img class="thumb" src="${thumbUrl}" alt="Aperçu ${c.id}"
             onerror="this.insertAdjacentHTML('afterend','<p class=muted>Aperçu introuvable : ${thumbUrl}</p>'); this.remove();">
      ` : `<p class="muted">Pas de vignette définie pour cette carte.</p>`}

      <div class="sp"></div>

      <p><strong>${titre}</strong></p>
      <p class="muted">${meta}</p>

      <div class="sp"></div>
      <p class="muted">Cette carte se charge via l’application E_PUNCH.</p>
      <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
    `;
  }

  load().catch(err => {
    content.innerHTML = `
      <p><strong>Erreur :</strong> ${err.message}</p>
      <p class="muted">Vérifie que <code>/cartes/index.json</code> est accessible.</p>
      <p class="muted"><a href="/cartes/">← Retour aux cartes</a></p>
    `;
    console.error(err);
  });
</script>
